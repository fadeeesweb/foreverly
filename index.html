<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />
    <meta name="theme-color" content="#ffd9e4" />
    <meta
      name="description"
      content="FOREVERLY — Create a beautiful private digital surprise: letter, memories, music, gifts and secret messages, shared as a single link."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Foreverly" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/svg+xml" href="./icons/logo.svg" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="/fonts.css" />
    <title>FOREVERLY — Create something they'll never forget</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          if (location.protocol === 'https:') {
            navigator.serviceWorker.register(new URL('sw.js', document.baseURI).href).catch(function () {});
          } else {
            /* local dev / preview: never let an old cache hide the fresh build */
            navigator.serviceWorker
              .getRegistrations()
              .then(function (rs) {
                rs.forEach(function (r) {
                  r.unregister();
                });
              })
              .catch(function () {});
            if (window.caches) {
              caches
                .keys()
                .then(function (ks) {
                  ks.forEach(function (k) {
                    caches.delete(k);
                  });
                })
                .catch(function () {});
            }
          }
        });
      }
    </script>
  </body>
</html>
